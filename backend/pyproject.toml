[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "studyflow-backend"
version = "0.1.0"
description = "StudyFlow async API foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.36,<2.1", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "pydantic>=2.12,<3", "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.3,<1", "email-validator>=2.2,<3",
  "tzdata>=2025.2", "slowapi==0.1.9", "limits>=5,<6",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "pytest>=8.4,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "unit: isolated validation, service and utility checks without PostgreSQL",
  "integration: API and persistence checks against the dedicated PostgreSQL database",
  "performance: bounded-query, pool and EXPLAIN checks on seeded test data",
]
